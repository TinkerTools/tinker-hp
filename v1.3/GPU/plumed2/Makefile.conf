# Keep the repository entry point portable.  The selected compiler wrappers,
# linker flags, and installation prefix live in the maintained platform
# configuration and can be overridden by the environment or make command
# line, just as with the historical Makefile.conf symlink.
makefile_conf_dir__ := $(dir $(abspath $(lastword $(MAKEFILE_LIST))))
include $(makefile_conf_dir__)Makefile.conf.nvhpc
